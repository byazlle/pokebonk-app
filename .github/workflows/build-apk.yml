name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APKs (original + gamepad)
        run: |
          gradle assembleOriginalDebug --no-daemon
          gradle assembleGamepadDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/original/debug/app-original-debug.apk dist/Pokebonk-原版-debug.apk
          cp app/build/outputs/apk/gamepad/debug/app-gamepad-debug.apk dist/Pokebonk-手柄版-debug.apk
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-apks
          path: dist/*.apk

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APKs (original + gamepad)
        run: |
          gradle assembleOriginalDebug --no-daemon
          gradle assembleGamepadDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/original/debug/app-original-debug.apk dist/Pokebonk-原版-debug.apk
          cp app/build/outputs/apk/gamepad/debug/app-gamepad-debug.apk dist/Pokebonk-手柄版-debug.apk
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-apks
          path: dist/*.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Windows package (Electron)
        run: |
          cd pc-app
          npm install --no-audit --no-fund
          npx electron-packager . Pokebonk --platform=win32 --arch=x64 --out=dist --overwrite
          cd dist
          zip -qr Pokebonk-0.2-pc-win64.zip Pokebonk-win32-x64

      - name: Upload PC package
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-pc
          path: pc-app/dist/Pokebonk-0.2-pc-win64.zip
